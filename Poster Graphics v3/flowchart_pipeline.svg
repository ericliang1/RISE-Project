<?xml version="1.0" encoding="UTF-8"?>
<!--
  Pipeline flowchart for the poster (portrait, single column) — v3,
  super-emitter benchmark: q 100-500 kg/h, 4-8 masts, THREE physics maps
  (the residual "Fit quality" map was dropped from the method).

  HOW TO EDIT
  ═══════════
  • All colors + fonts live in the <style> block below — change them once there.
  • Each stage is one <g id="stage-N" transform="translate(40, Y)"> — move a
    whole card by editing its Y. Card-internal coordinates never change.
  • Text is real <text>/<tspan>; edit wording in place. One bullet = one <text>.
  • Sizing: at a 9-inch print width, 1px = 0.72pt, so 32px titles = 23pt and
    24px body = 17pt (poster-distance legible).
  • Stage-3 chip colors match the model palette used in every other poster
    figure (DeepSets blue / GNN red / Set Transformer green).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1372"
     viewBox="0 0 900 1372" font-family="Arial, Helvetica, sans-serif">

  <style>
    .bg      { fill: #fcfcfb; }
    .card    { fill: #ffffff; stroke: #c3c2b7; stroke-width: 1.8; }
    .badge   { fill: #2a78d6; }
    .badge-n { fill: #ffffff; font-size: 26px; font-weight: bold; }
    .title   { fill: #0b0b0b; font-size: 32px; font-weight: bold; }
    .body    { fill: #0b0b0b; font-size: 24px; }
    .muted   { fill: #52514e; }
    .arrow   { stroke: #52514e; stroke-width: 4; fill: none; }
    .tile    { fill: #eaf2fc; stroke: #2a78d6; stroke-width: 2; }
    .tile-t  { fill: #0b0b0b; font-size: 22px; font-weight: bold; }
    .chip-ds { fill: #eaf2fc; stroke: #2a78d6; stroke-width: 2.5; }
    .chip-gn { fill: #f9e9e9; stroke: #c94040; stroke-width: 2.5; }
    .chip-st { fill: #e6f7f0; stroke: #1baf7a; stroke-width: 2.5; }
    .chip-t  { fill: #0b0b0b; font-size: 22px; font-weight: bold; }
    .dot-ds  { fill: #2a78d6; }
    .dot-gn  { fill: #c94040; }
    .dot-st  { fill: #1baf7a; }
  </style>

  <defs>
    <!-- arrowhead drawn pointing along +x; orient="auto" rotates it onto
         the line direction (downward here) -->
    <marker id="arrowhead" viewBox="0 0 10 10" markerWidth="7"
            markerHeight="7" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#52514e"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="900" height="1372"/>

  <!-- ══════════ STAGE 1 · Methane-Leak Simulator ══════════ -->
  <g id="stage-1" transform="translate(40, 44)">
    <rect class="card" x="0" y="0" width="820" height="274" rx="16"/>
    <circle class="badge" cx="0" cy="0" r="24"/>
    <text class="badge-n" x="0" y="9" text-anchor="middle">1</text>
    <text class="title" x="44" y="52">Methane-Leak Simulator (CH4-T)</text>
    <text class="body" x="44" y="106">• 500 × 500 m site · Gaussian-plume physics · 30 one-min readings</text>
    <text class="body" x="44" y="150">• 1 super-emitter source (100–500 kg/h) · 4–8 sensor masts</text>
    <text class="body" x="44" y="194">• Sensors see the true wind — models get noisy anemometer wind</text>
    <text class="body" x="44" y="238">• 10,000 train / 2,000 calibration / 2,000 test scenarios</text>
  </g>
  <line class="arrow" x1="450" y1="326" x2="450" y2="380" marker-end="url(#arrowhead)"/>

  <!-- ══════════ STAGE 2 · Physics-Derived Feature Maps ══════════ -->
  <g id="stage-2" transform="translate(40, 392)">
    <rect class="card" x="0" y="0" width="820" height="284" rx="16"/>
    <circle class="badge" cx="0" cy="0" r="24"/>
    <text class="badge-n" x="0" y="9" text-anchor="middle">2</text>
    <text class="title" x="44" y="52">Physics-Derived Feature Maps</text>
    <!-- three map tiles (canonical names, two lines each) -->
    <rect class="tile" x="44"  y="76" width="173" height="84" rx="12"/>
    <text class="tile-t" x="130" y="112" text-anchor="middle">Source
      <tspan x="130" dy="26">evidence</tspan></text>
    <rect class="tile" x="327" y="76" width="173" height="84" rx="12"/>
    <text class="tile-t" x="413" y="112" text-anchor="middle">Sensor
      <tspan x="413" dy="26">visibility</tspan></text>
    <rect class="tile" x="611" y="76" width="173" height="84" rx="12"/>
    <text class="tile-t" x="697" y="112" text-anchor="middle">Wind
      <tspan x="697" dy="26">sensitivity</tspan></text>
    <text class="body" x="44" y="206">• One value per candidate source cell (64 × 64 grid)</text>
    <text class="body" x="44" y="250">• Averaged over 8 plausible winds (anemometer error range)</text>
  </g>
  <line class="arrow" x1="450" y1="684" x2="450" y2="738" marker-end="url(#arrowhead)"/>

  <!-- ══════════ STAGE 3 · Neural-Network Models ══════════ -->
  <g id="stage-3" transform="translate(40, 750)">
    <rect class="card" x="0" y="0" width="820" height="274" rx="16"/>
    <circle class="badge" cx="0" cy="0" r="24"/>
    <text class="badge-n" x="0" y="9" text-anchor="middle">3</text>
    <text class="title" x="44" y="52">Neural-Network Models</text>
    <!-- three model chips (colors match the other poster figures) -->
    <rect class="chip-ds" x="44" y="76" width="233" height="72" rx="12"/>
    <circle class="dot-ds" cx="76" cy="112" r="8"/>
    <text class="chip-t" x="96" y="120">DeepSets</text>
    <rect class="chip-gn" x="293" y="76" width="233" height="72" rx="12"/>
    <circle class="dot-gn" cx="325" cy="112" r="8"/>
    <text class="chip-t" x="345" y="120">GNN</text>
    <rect class="chip-st" x="542" y="76" width="233" height="72" rx="12"/>
    <circle class="dot-st" cx="574" cy="112" r="8"/>
    <text class="chip-t" x="594" y="120">Set Transformer</text>
    <text class="body" x="44" y="196">• A small CNN reads the three maps and adds a physics correction</text>
    <text class="body" x="44" y="240">• Only ~0.2% more parameters</text>
  </g>
  <line class="arrow" x1="450" y1="1032" x2="450" y2="1086" marker-end="url(#arrowhead)"/>

  <!-- ══════════ STAGE 4 · Calibrated Localization ══════════ -->
  <g id="stage-4" transform="translate(40, 1098)">
    <rect class="card" x="0" y="0" width="820" height="230" rx="16"/>
    <circle class="badge" cx="0" cy="0" r="24"/>
    <text class="badge-n" x="0" y="9" text-anchor="middle">4</text>
    <text class="title" x="44" y="52">Calibrated Localization</text>
    <text class="body" x="44" y="106">• Split conformal prediction → a guaranteed localization region</text>
    <text class="body" x="44" y="150">• Contains the true source in ≥ 90% of comparable scenarios</text>
    <text class="body" x="44" y="194">• Goal: shrink the region — coverage is already fixed near 90%</text>
  </g>

</svg>
