# =====================================================================
# Conformal Source Regions — THE one config.
# Every stage reads only from this file. Paper = authoritative spec;
# values here transcribe the paper/prompt. Deviations are documented
# in GATES.md.
# =====================================================================

paths:
  # data/ is a symlink -> /projectnb/rise-tower/eric1/csr-data (10 GB home quota)
  data_dir: data
  results_dir: results
  figures_dir: figures
  checkpoints_dir: data/checkpoints   # checkpoints live on projectnb too

seeds:
  root_entropy: 20260717          # root of every SeedSequence in the project
  train_seeds: [1, 2]             # two training seeds (paper: two seeds)
  torch_train_base: 1000          # torch seed = torch_train_base + train_seed

physics:
  domain: [0.0, 1.0]              # unit square, both axes
  t_max: 1.0
  sigma_s: 0.0078125              # source blob width 1/128
  c_ref: 1.0                      # normalization constant C_ref (documented choice)
  quad_nodes: 64                  # Gauss-Legendre nodes for the age integral
  quad_nodes_check: 128           # convergence-gate comparison
  tau_max: 12.0                   # log-age substitution s = t*exp(-tau), tau in [0, tau_max]
                                  # (tuned: median 64-vs-128 rel err ~4e-11; tail truncation
                                  #  <~1e-6 even for sensor-on-source; see GATES.md)
  gen_dtype: float32              # bulk generation dtype
  val_dtype: float64              # validation / oracle dtype

grid:
  n: 64                           # 64 x 64 = 4096 cells over [0,1]^2
  refine_n: 96                    # appendix E stretch grid
  # cell id convention: cell = iy * n + ix, ix = floor(x*n), iy = floor(y*n),
  # clipped to [0, n-1]; cell centers at ((ix+0.5)/n, (iy+0.5)/n).

prior:
  source_low: 0.1                 # x_s ~ Uniform([0.1,0.9]^2)
  source_high: 0.9
  q_log_low: 0.5                  # q ~ LogUniform(0.5, 5)
  q_log_high: 5.0
  wind_speed_low: 0.5             # ||u|| ~ Uniform(0.5, 2.0)
  wind_speed_high: 2.0
  diff_log_low: 0.002             # D ~ LogUniform(0.002, 0.02)
  diff_log_high: 0.02
  n_sensors_low: 4                # N ~ Uniform int {4..12}
  n_sensors_high: 12
  sigma_log_low: 0.01             # sigma ~ LogUniform(0.01, 0.10)
  sigma_log_high: 0.10
  p_drop_low: 0.0                 # p_drop ~ Uniform(0, 0.20), Bernoulli per reading
  p_drop_high: 0.20
  n_times: 30                     # t_k = k/30, k = 1..30

splits:
  train: 10000
  val: 1000
  calib: 2000
  test: 2000

dose_response:
  n_base: 50                      # base scenarios; source locations Latin-hypercube spread
  master_sensors: 12              # frozen master layout + fixed insertion order
  nested_range: [4, 12]           # Knob 1: nested subsets N = 4..12
  geometry_n: 6                   # Knob 2: matched pairs at N = 6
  geometry_grid: [3, 2]           # stratified layout: jittered 3x2 grid
  sigma_sweep_points: 7           # Knob 3: log-spaced sigma values in [0.01, 0.10]
  sigma_sweep_range: [0.01, 0.10]
  sigma_sweep_sensors: 8          # sigma sweep uses first 8 master sensors (documented choice)
  p_drop: 0.0                     # dose-response sets use no dropout (controlled intervention;
                                  # in-support boundary of U(0,0.20) — documented choice)

model:
  fourier_freqs: [1, 2, 4, 8]     # sin(pi f x), cos(pi f x) -> 8 dims per coordinate
  token_dim: 25                   # 8+8+8+1
  token_hidden: 256               # per-token MLP 25 -> 256 -> 256, GELU + LayerNorm
  pool: mean_max                  # masked mean + masked max, concatenated (512)
  context_hidden: 64              # (u, v, logD, logsigma, N) -> 64 -> 64
  decoder_hidden: 1024            # 576 -> 1024 -> 4096 logits
  target_smooth_std_cells: 0.75   # Gaussian bump std in cells
  target_trunc_sigmas: 3.0        # truncated at 3 std

training:
  d4_augment: true                # DOCUMENTED DEVIATION: exact D4-symmetry batch
                                  # augmentation (see GATES.md G2 — without it the
                                  # paper recipe memorizes with zero generalization)
  lr: 3.0e-4
  lr_final: 3.0e-5                # cosine decay 3e-4 -> 3e-5
  weight_decay: 1.0e-4
  batch_size: 256
  max_epochs: 200
  early_stop_patience: 25         # on validation NLL (true-cell NLL)
  grad_clip: 1.0
  amp_dtype: bfloat16             # mixed precision (L40S)
  num_workers: 0

conformal:
  alpha: 0.10                     # 90% target; threshold = ceil((n+1)(1-alpha))-th smallest score
  aux_levels: [0.80, 0.95]        # appendix levels
  nominal_sweep: 33               # nominal grid for fig3: linspace(0.50, 0.98, 33)
  nominal_sweep_range: [0.50, 0.98]
  score_seed: 777                 # RNG for the tie-breaking U_j (and test-time U for sweeps)

oracle:
  # DOCUMENTED DEVIATION from the paper's "32-node GL in log q": that fixed rule
  # cannot resolve the q-likelihood peak (width sigma/||g_c||, up to ~1000x
  # narrower than its node spacing) and fails the brute-force gate by many nats.
  # We use a peak-aware composite GL rule over q in [0.5, 5]: panels split at
  # qhat_c +/- 8 sigma_q, 32 nodes on the peak panel, 16 per outer panel.
  q_peak_nodes: 32
  q_outer_nodes: 16
  q_peak_halfwidth_sigmas: 8.0
  cell_chunk: 1024                # cells per GPU chunk when building g_c
  dtype: float64                  # oracle entirely in float64 log-space
  sanity_sigma_small: 1.0e-6      # "sigma -> 0" mode-recovery check (1e-4 is not
                                  # yet asymptotic for weak-signal scenarios whose
                                  # adjacent-cell responses differ by < 1e-4)
  brute_force_q_grid: 200000      # trapezoid grid in log q for cross-check
  n_sanity_scenarios: 24

fd_check:
  n_scenarios: 20                 # FD cross-check scenarios (gate < 1% rel L2)
  h: 0.0013020833333333333        # grid spacing 1/768 (self-convergence verified vs 1/256, 1/384, 1/512)
  cfl_safety: 0.4
  margin: 0.6                     # box margin beyond sensors/plume support
  tol_rel_l2: 0.01
  convergence_h: [0.00390625, 0.002604167, 0.001953125]  # 1/256, 1/384, 1/512 self-convergence
  n_convergence_scenarios: 2

evaluation:
  latency_scenarios: 200          # batch-1 latency measurement
  jsd_dtype: float64
  refine_scenarios: 100           # appendix E: 96x96 refinement on 100 test scenarios
